spring:
  thymeleaf:
    cache: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defense_management?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DefenseHikariPool-Prod
  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: defense:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.example.defensemanagement: INFO
    org.springframework.security: WARN
    com.example.defensemanagement.mapper: WARN
  file:
    name: ${LOG_PATH:logs}/defense-management.log

