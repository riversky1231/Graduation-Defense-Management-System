spring:
  thymeleaf:
    cache: true
  web:
    resources:
      static-locations: classpath:/static/,classpath:/resources/,classpath:/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/defense_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.defensemanagement.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.defensemanagement: DEBUG
    org.springframework.security: DEBUG
    com.example.defensemanagement.mapper: debug

app:
  upload:
    signature-max-size-bytes: 2097152
    template-max-size-bytes: 10485760
    default-max-size-bytes: 5242880
