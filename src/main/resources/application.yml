spring:
  thymeleaf:
    cache: true
  web:
    resources:
      static-locations: classpath:/static/,classpath:/resources/,classpath:/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  session:
    store-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defense_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    # 开发环境默认值 root/root，生产环境通过环境变量注入（见 application-prod.yml）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DefenseHikariPool
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.defensemanagement.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.defensemanagement: DEBUG
    org.springframework.security: DEBUG
    com.example.defensemanagement.mapper: DEBUG

app:
  upload:
    signature-max-size-bytes: 2097152
    template-max-size-bytes: 10485760
    default-max-size-bytes: 5242880

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: 毕业答辩管理系统
    version: 1.0.0
