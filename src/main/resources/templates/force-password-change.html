<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首次修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #edf3fb 0%, #dbe8f7 100%);
            font-family: "Noto Sans SC", sans-serif;
        }

        .panel {
            width: min(460px, 92vw);
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(44, 82, 130, 0.15);
            padding: 2rem;
        }

        .panel-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #2c5282, #4a6fa5);
            color: #fff;
            font-size: 1.5rem;
        }

        .hint {
            color: #52667d;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<div class="panel">
    <div class="panel-icon">
        <i class="bi bi-shield-lock"></i>
    </div>
    <h3 class="mb-2">请先修改初始密码</h3>
    <p class="hint mb-4">
        <span th:text="${displayName}">当前用户</span> 正在使用初始化密码。继续访问系统前，必须先设置新的安全密码。
    </p>

    <div class="alert d-none" id="resultAlert" role="alert"></div>

    <form id="changePasswordForm">
        <div class="mb-3">
            <label for="oldPassword" class="form-label">当前密码</label>
            <input id="oldPassword" name="oldPassword" type="password" class="form-control" required maxlength="128">
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">新密码</label>
            <input id="newPassword" name="newPassword" type="password" class="form-control" required maxlength="128">
            <div class="form-text">密码长度为 8-128 位，且不能与当前密码相同。</div>
        </div>
        <div class="mb-4">
            <label for="confirmPassword" class="form-label">确认新密码</label>
            <input id="confirmPassword" type="password" class="form-control" required maxlength="128">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" type="submit" id="submitButton">保存新密码</button>
            <a class="btn btn-outline-secondary" href="/logout">退出登录</a>
        </div>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("changePasswordForm");
    const submitButton = document.getElementById("submitButton");
    const resultAlert = document.getElementById("resultAlert");

    function showMessage(type, message) {
        resultAlert.className = "alert alert-" + type;
        resultAlert.textContent = message;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            showMessage("danger", "两次输入的新密码不一致");
            return;
        }

        submitButton.disabled = true;
        try {
            const response = await fetch("/changePassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: new URLSearchParams({
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            });

            const result = await response.json();
            if (result.success) {
                showMessage("success", result.message || "密码修改成功，正在进入系统");
                setTimeout(function () {
                    window.location.href = "/";
                }, 800);
            } else {
                showMessage("danger", result.message || "密码修改失败");
            }
        } catch (error) {
            showMessage("danger", "密码修改失败，请稍后重试");
        } finally {
            submitButton.disabled = false;
        }
    });
});
</script>
</body>
</html>
